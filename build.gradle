plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'team.rainfall.finality'
version = '1.6.0'


repositories {
    maven {
        url 'https://maven.aliyun.com/repository/public/'
    }
    maven {
        url "https://jitpack.io/"
    }
    maven {
        url "https://plugins.gradle.org/m2/"
    }
    mavenCentral()
}

dependencies {
    implementation group: 'org.semver4j', name: 'semver4j', version: '5.6.0'
    implementation 'com.formdev:flatlaf:3.5'
    implementation("com.konghq:unirest-java:3.14.5")
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.53'
    implementation group:'org.ow2.asm',name:'asm',version:'9.7'
    implementation group:'org.ow2.asm',name:'asm-commons',version:'9.7'
    implementation group:'org.ow2.asm',name:'asm-util',version:'9.7'
    implementation group:'org.ow2.asm',name:'asm-tree',version:'9.7'
    implementation group:'org.ow2.asm',name:'asm-analysis',version:'9.7'
    implementation 'net.java.dev.jna:jna-platform:5.13.0'
    implementation 'commons-cli:commons-cli:1.9.0'
}

shadowJar {
    archiveClassifier = ''
    manifest {
        attributes 'Main-Class': 'team.rainfall.finality.loader.Main'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

ext.buildVersionType = 'DEV'

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(tasks.release)) {
        ext.buildVersionType = 'RELEASE'
    } else if (graph.hasTask(tasks.beta)) {
        ext.buildVersionType = 'BETA'
    }
}

task generateBuildConfig {
    outputs.upToDateWhen { false }
    outputs.file file('src/main/java/team/rainfall/finality/loader/BuildConfig.java')
    doLast {
        def srcFile = file('src/main/java/team/rainfall/finality/loader/BuildConfig.java')
        srcFile.text = """package team.rainfall.finality.loader;

public class BuildConfig {
    public static final VersionType VERSION_TYPE = VersionType.${project.ext.buildVersionType};
}
"""
    }
}

compileJava.dependsOn generateBuildConfig

java{
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourcesJar.dependsOn generateBuildConfig

task beta {
    description = 'Create a beta set of Jars.'
    group = 'build'
    dependsOn clean, shadowJar, sourcesJar
}

task release {
    description = 'Create a release set of Jars.'
    group = 'build'
    dependsOn clean, shadowJar, sourcesJar
}